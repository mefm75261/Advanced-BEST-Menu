/* ============================================================
   10. SISTEMA DE AYUDA CONTEXTUAL (popover flotante con flecha)
   En vez de bloques de texto siempre visibles, cada campo tiene un
   icono "i" que, al enfocar/pasar el mouse, muestra un globo con
   flecha apuntando al campo — y desaparece al salir. Solo existe
   en modo "Con guía"; en "Sin guía" no se renderiza ningún icono.
   ============================================================ */
let TIP_SEQ = 0;
const TIP_REGISTRY = {};
function registerTip(text, examples){
  const id = 'tip'+(TIP_SEQ++);
  const ex = (examples&&examples.length) ? `<span class="tip-examples">Ejemplos: ${examples.map(esc).join(' · ')}</span>` : '';
  TIP_REGISTRY[id] = `${esc(text)}${ex}`;
  return id;
}
function helpIcon(text, examples){
  if(!state.guided) return '';
  const id = registerTip(text, examples);
  return `<button type="button" class="help-icon" data-tip-id="${id}" aria-label="Ayuda">i</button>`;
}
function fieldRow(labelHtml, inputHtml){
  return `<div class="field-row"><div class="field-main">${labelHtml}${inputHtml}</div></div>`;
}
function cardTip(text){

/* ============================================================
   10b. MOTOR DE MICRO-PASOS (instructivo interactivo dentro de
   cada sección): las tarjetas se muestran apagadas, y se van
   encendiendo una por una a medida que el usuario avanza. El
   mensaje de ayuda del paso activo se muestra al lado, siempre
   visible mientras ese paso está activo (no requiere hover).
   ============================================================ */
const MICRO_STEPS = {}; // sectionKey -> [{ tip, examples, isDone, render }]

function computeMicroNatural(sectionKey){
  const steps = MICRO_STEPS[sectionKey];
  if(!steps || !steps.length) return 1;
  let count = 1;
  for(let i=0;i<steps.length-1;i++){
    if(steps[i].isDone()) count = i+2; else break;
  }
  return count;
}
function microUnlocked(sectionKey){
  if(!state.microProgress) state.microProgress = {};
  const natural = computeMicroNatural(sectionKey);
  state.microProgress[sectionKey] = Math.max(state.microProgress[sectionKey]||1, natural);
  return state.microProgress[sectionKey];
}

function renderMicroSteps(sectionKey){
  const steps = MICRO_STEPS[sectionKey];
  if(!steps || !steps.length) return '';

  if(!state.guided){
    // Sin guía: todas las tarjetas visibles y activas, sin atenuar, sin mensajes.
    return steps.map(s=>`<div class="card micro-card">${s.render('')}</div>`).join('');
  }

  const unlocked = microUnlocked(sectionKey);
  return steps.map((s,i)=>{
    const stepNum = i+1;
    const status = stepNum < unlocked ? 'done' : stepNum===unlocked ? 'active' : 'locked';
    const badgeContent = status==='done' ? '✓' : status==='locked' ? '🔒' : stepNum;
    const showContinue = status==='active' && stepNum < steps.length;

    const continueBtnHtml = showContinue ? `<button class="btn btn-primary btn-sm" data-action="micro-continue" data-section="${sectionKey}" data-step="${stepNum}">Continuar →</button>` : '';
    const cardInner = `
      <div class="${s.wrapClass||'card'} micro-card">
        <div class="step-num-badge ${status}">${badgeContent}</div>
        ${s.render(continueBtnHtml)}
      </div>`;

    if(status==='active' && s.tip){
      const ex = (s.examples&&s.examples.length) ? `<span class="tip-examples">Ejemplos: ${s.examples.map(esc).join(' · ')}</span>` : '';
      return `<div class="micro-step active">
        <div class="micro-row">
          ${cardInner}
          <div class="micro-message"><span class="msg-label">Instrucción</span>${boldFirstSentence(s.tip)}${ex}</div>
        </div>
      </div>`;
    }
    return `<div class="micro-step ${status}">${cardInner}</div>`;
  }).join('');
}

ACTIONS['micro-continue'] = (ds)=>{
  const key = ds.section, step = parseInt(ds.step,10);
  if(!state.microProgress) state.microProgress = {};
  state.microProgress[key] = Math.max(state.microProgress[key]||1, step+1);
  scheduleSave();
  renderMain();
};

function positionCoachTooltip(anchor){
  const tip = document.getElementById('coach-tooltip');
  const id = anchor.dataset.tipId;
  if(!id || !TIP_REGISTRY[id]) return;
  tip.innerHTML = TIP_REGISTRY[id];
  tip.classList.remove('arrow-top','arrow-bottom','arrow-left','arrow-right');

  const r = anchor.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  tip.style.visibility = 'hidden';
  tip.classList.add('show');
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.classList.remove('show');
  tip.style.visibility = '';

  const spaceRight = vw - r.right, spaceBelow = vh - r.bottom;
  let top, left, arrowClass;
  if(spaceRight > tw+24){
    left = r.right+12; top = Math.max(10, r.top + r.height/2 - th/2);
    arrowClass='arrow-left'; tip.style.setProperty('--arrow-y', Math.max(10,Math.min(th-20,r.top+r.height/2-top))+'px');
  } else if(spaceBelow > th+24){
    top = r.bottom+10; left = Math.max(10, Math.min(vw-tw-10, r.left + r.width/2 - tw/2));
    arrowClass='arrow-top'; tip.style.setProperty('--arrow-x', Math.max(10,Math.min(tw-20,r.left+r.width/2-left))+'px');
  } else {
    top = Math.max(10, r.top - th - 10); left = Math.max(10, Math.min(vw-tw-10, r.left + r.width/2 - tw/2));
    arrowClass='arrow-bottom'; tip.style.setProperty('--arrow-x', Math.max(10,Math.min(tw-20,r.left+r.width/2-left))+'px');
  }
  tip.style.top = top+'px';
  tip.style.left = left+'px';
  tip.classList.add(arrowClass);
  tip.classList.add('show');
}
function hideCoachTooltip(){
  document.getElementById('coach-tooltip').classList.remove('show');
}
document.body.addEventListener('mouseenter', (e)=>{
  const el = e.target.closest && e.target.closest('.help-icon');
  if(el) positionCoachTooltip(el);
}, true);
document.body.addEventListener('mouseleave', (e)=>{
  const el = e.target.closest && e.target.closest('.help-icon');
  if(el) hideCoachTooltip();
}, true);
document.body.addEventListener('focusin', (e)=>{
  const el = e.target.closest && e.target.closest('.help-icon');
  if(el) positionCoachTooltip(el);
});
document.body.addEventListener('focusout', (e)=>{
  const el = e.target.closest && e.target.closest('.help-icon');
  if(el) hideCoachTooltip();
});
window.addEventListener('scroll', hideCoachTooltip, true);

function resizeImageFile(file, maxDim){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.75) });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

};

function cssVarToHex(varExpr){
  const map = {
    'var(--cat-people)':'#7C4FD9','var(--cat-machine)':'#2166D6','var(--cat-environment)':'#178A53',
    'var(--cat-material)':'#B9800A','var(--cat-process)':'#D1553D','var(--cat-measurement)':'#3D4E6E'
  };
  return map[varExpr]||'#4B5878';
}

const FB_VIEW = { w:1200, h:720 };
const FB_GEOM = (()=>{
  const spineY = 360, startX = 70, endX = 990;
  const cols = [270, 570, 860];
  function tip(i, dir){
    const bx = cols[i];
    const tipY = dir==='top' ? spineY-140 : spineY+140;
    const tipX = bx - 90;
    return { bx, tipY, tipX };
  }
  return { spineY, startX, endX, cols, tip };
})();

function fishboneBackgroundSvg(){
  const { spineY, startX, endX } = FB_GEOM;
  const cats = REF.ishikawaCategories;
  const lines = cats.map((c,i)=>{
    const dir = i<3 ? 'top':'bottom';
    const colIdx = i<3 ? i : i-3;
    const { bx, tipY, tipX } = FB_GEOM.tip(colIdx, dir);
    return `<line x1="${bx}" y1="${spineY}" x2="${tipX}" y2="${tipY}" stroke="${cssVarToHex(c.color)}" stroke-width="2.5" opacity="0.85"/>`;
  }).join('');
  return `
  <svg class="fb-svg-layer" viewBox="0 0 ${FB_VIEW.w} ${FB_VIEW.h}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <line x1="${startX}" y1="${spineY}" x2="${endX}" y2="${spineY}" stroke="var(--border-strong)" stroke-width="2.5"/>
    <polygon points="${endX},${spineY-16} ${endX+38},${spineY} ${endX},${spineY+16}" fill="var(--border-strong)"/>
    ${lines}
    <rect x="${endX+6}" y="${spineY-26}" width="${FB_VIEW.w-endX-30}" height="52" rx="10" fill="var(--accent)"/>
    <text x="${endX + (FB_VIEW.w-endX-24)/2}" y="${spineY+6}" fill="#fff" font-family="Baloo 2" font-size="15" font-weight="700" text-anchor="middle">PROBLEMA</text>
  </svg>`;
}

function ishikawaFocusCategory(){

function renderFishboneDiagram(){
  const focusCat = state.guided ? ishikawaFocusCategory() : null;

  function chipHtml(cat, c, idx, atLimit, noneSelected){
    const disabled = (!c.selected && atLimit);
    const hasText = !!(c.text||'').trim();
    const chkTitle = c.selected ? L('Quitar de las causas a priorizar','Remove from causes to prioritize') : L('Marcar como causa probable → pasa a Priorización','Mark as probable cause → goes to Prioritization');
    return `
      <div class="fb-chip ${c.selected?'selected':''}" data-cat="${cat.key}" data-idx="${idx}">
        <button type="button" class="fb-check ${c.selected?'on':''} ${(!c.selected && hasText && noneSelected)?'hint':''}" role="checkbox" aria-checked="${c.selected?'true':'false'}" data-action="toggle-cause" data-cat="${cat.key}" data-idx="${idx}" aria-label="${esc(chkTitle)}" data-fbtip="${esc(chkTitle)}">${c.selected?'✓':''}</button>
        <input type="text" class="fb-chip-input" data-bind="ishikawa.${cat.key}.${idx}.text" value="${esc(c.text)}" placeholder="Escribe una causa…">

      </div>`;
  }

  const selectedCount = countSelectedCauses();
  const atLimit = selectedCount >= REF.maxSelectedCauses;
  const noneSelected = selectedCount===0;

  const slots = REF.ishikawaCategories.map((cat,i)=>{
    const dir = i<3 ? 'top':'bottom';
    const colIdx = i<3 ? i : i-3;
    const { tipX, tipY } = FB_GEOM.tip(colIdx, dir);
    const leftPct = (tipX/FB_VIEW.w*100).toFixed(2)+'%';
    const list = state.ishikawa[cat.key];
    const chips = list.map((c,idx)=>chipHtml(cat,c,idx,atLimit,noneSelected)).join('');
    const isFocus = focusCat && focusCat.key===cat.key;
    const posStyle = dir==='top'
      ? `left:${leftPct}; bottom:${(100-(tipY/FB_VIEW.h*100)).toFixed(2)}%;`
      : `left:${leftPct}; top:${(tipY/FB_VIEW.h*100).toFixed(2)}%;`;
    return `
      <div class="bone-slot ${dir} ${isFocus?'focus':''}" style="${posStyle}">
        <div class="bone-cat-label" style="color:${cat.color}">
          <span class="cat-dot" style="background:${cat.color}"></span>
          ${esc(cat.name)}
          ${helpIcon(cat.tip)}
        </div>
        <div class="fb-chip-stack">${chips}</div>
        <button class="fb-add-chip" data-action="add-cause" data-cat="${cat.key}">+ agregar causa</button>
      </div>`;
  }).join('');

  const banner = focusCat ? `
    <div class="fb-focus-banner">
      <span class="fb-focus-dot"></span>
      <span>${boldFirstSentence(L('Enfócate en '+focusCat.name.toUpperCase()+' por ahora.','Focus on '+trs(focusCat.name).toUpperCase()+' for now.'))} ${esc(focusCat.tip)}</span>
    </div>` : '';

  const howto = `
    <div class="fb-howto">
      <span class="fb-howto-box"><i>✓</i></span>
      <span>${L('<b>Paso clave:</b> marca la casilla <b>☐</b> de cada causa que consideres <b>más probable</b> (hasta '+REF.maxSelectedCauses+'). <b>Solo las marcadas pasan a Priorización.</b> Pasa el cursor o toca una causa para leerla completa.','<b>Key step:</b> tick the <b>☐</b> box on each cause you find <b>most likely</b> (up to '+REF.maxSelectedCauses+'). <b>Only ticked causes go to Prioritization.</b> Hover or tap a cause to read it in full.')}</span>
    </div>`;
  const nextSec = SECTIONS[SECTIONS.findIndex(x=>x.key==='ishikawa')+1];
  const selCta = selectedCount>=1
    ? `<button type="button" class="btn btn-primary fb-sel-cta" data-action="scroll-to-section" data-target="${nextSec?nextSec.key:'matrix'}">${L('Continuar a','Continue to')} ${esc(nextSec?nextSec.label:'Priorización')} →</button>`
    : `<span class="fb-sel-hint">${L('☝ Marca al menos 1 causa para continuar','☝ Tick at least 1 cause to continue')}</span>`;
  return `
    ${banner}
    ${howto}
    <div class="fb-wrap">
      <div class="fb-canvas fb-diagram ${focusCat?'guided-focus':''}">
        ${fishboneBackgroundSvg()}
        ${slots}
      </div>
    </div>
    <div class="selection-bar">
      <span class="selection-count"><b>${selectedCount}</b> / ${REF.maxSelectedCauses} seleccionadas para priorizar</span>
      <div class="selection-bar-track"><div class="selection-bar-fill" style="width:${Math.min(100,selectedCount/REF.maxSelectedCauses*100)}%"></div></div>
      ${atLimit?'<span class="badge badge-warning">Límite alcanzado</span>':''}
      ${selCta}
    </div>
  `;
}

const SEARCH_LEAF = {
  projectName:'Nombre del proyecto', trend:'Tendencia', process:'Proceso', currentSituation:'Situación actual',
  desiredSituation:'Situación deseada', gap:'Brecha', statementText:'Planteamiento', text:'Texto',
  rootCause:'Causa raíz', action:'Acción', responsible:'Responsable'
};
function normTxt(t){ return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function buildSearchIndex(){
  const out = [];
  const add = (path, text, section, label)=>{ if(typeof text==='string' && text.trim()) out.push({path, text, section, label}); };
  add('projectName', state.projectName, 'statement', 'Problema · Nombre');
  const st = state.statement || {};
  Object.keys(SEARCH_LEAF).forEach(k=>{ if(k!=='projectName' && typeof st[k]==='string') add('statement.'+k, st[k], 'statement', 'Problema · '+SEARCH_LEAF[k]); });
  (st.symptoms||[]).forEach((t,i)=> add('statement.symptoms.'+i, t, 'statement', 'Problema · Síntoma'));
  (REF.ishikawaCategories||[]).forEach(cat=>{
    ((state.ishikawa||{})[cat.key]||[]).forEach((c,i)=> add('ishikawa.'+cat.key+'.'+i+'.text', c.text, 'ishikawa', 'Ishikawa · '+cat.name));
  });
  (state.whyGroups||[]).forEach((g,gi)=>{
    Object.keys(g.paths||{}).forEach(pk=>{
      const p = g.paths[pk];
      (p.levels||[]).forEach((l,li)=> add('whyGroups.'+gi+'.paths.'+pk+'.levels.'+li+'.text', l.text, 'whys', '5 Porqués · '+(li+1)+'º porqué'));
      add('whyGroups.'+gi+'.paths.'+pk+'.rootCause', p.rootCause, 'whys', '5 Porqués · Causa raíz');
    });
  });
  ((state.countermeasures||{}).actions||[]).forEach((r,i)=>{
    add('countermeasures.actions.'+i+'.action', r.action, 'countermeasures', 'Plan · Acción');
    add('countermeasures.actions.'+i+'.responsible', r.responsible, 'countermeasures', 'Plan · Responsable');
    if(!r.sourceId) add('countermeasures.actions.'+i+'.rootCause', r.rootCause, 'countermeasures', 'Plan · Causa raíz');
  });
  return out;
}
function jumpToField(item){
  goSection(item.section);
  setTimeout(()=>{
    const el = document.querySelector('[data-bind="'+item.path+'"]');
    if(!el){ showToast('Ese campo aún no está visible en esta vista', true); return; }
    el.scrollIntoView({block:'center', behavior:'smooth'});
    try{ el.focus({preventScroll:true}); }catch(e){}
    el.classList.remove('flash-found'); void el.offsetWidth; el.classList.add('flash-found');
    setTimeout(()=> el.classList.remove('flash-found'), 1900);
  }, state.stepView ? 120 : 450);
}
function setupGlobalSearch(){
  const input = document.getElementById('gsearch');
  const box = document.getElementById('gsearch-res');
  if(!input || !box) return;
  let items = [], sel = 0;
  const close = ()=>{ box.classList.remove('open'); };
  const paint = ()=>{
    const q = normTxt(input.value.trim());
    if(!q){ close(); return; }
    items = buildSearchIndex().filter(it=> normTxt(it.text).includes(q)).slice(0,14);
    sel = 0;
    box.innerHTML = items.length
      ? items.map((it,i)=>{
          const n = normTxt(it.text), at = n.indexOf(q);
          let txt = it.text;
          const from = Math.max(0, at-24);
          let pre = (from>0?'…':'') + esc(txt.slice(from, at)), mid = esc(txt.slice(at, at+q.length)), post = esc(txt.slice(at+q.length, at+q.length+60)) + (txt.length>at+q.length+60?'…':'');
          return '<button type="button" data-i="'+i+'" class="'+(i===0?'sel':'')+'"><span class="gs-lbl">'+esc(it.label)+'</span>'+pre+'<mark>'+mid+'</mark>'+post+'</button>';
        }).join('')
      : '<div class="gs-empty">'+L('No encontré «'+esc(input.value.trim())+'» en tus datos.','Nothing found for «'+esc(input.value.trim())+'» in your data.')+'</div>';
    box.classList.add('open');
    box.style.left = '0'; box.style.right = 'auto';
    const r = box.getBoundingClientRect();
    if(r.right > window.innerWidth - 8){ box.style.left = 'auto'; box.style.right = '0'; }
    if(box.getBoundingClientRect().left < 8){ const g = input.getBoundingClientRect(); box.style.left = (8 - g.left) + 'px'; box.style.right = 'auto'; }
  };
  input.addEventListener('input', paint);
  input.addEventListener('focus', paint);
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Escape'){ close(); input.blur(); }
    else if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      if(!items.length) return; e.preventDefault();
      sel = (sel + (e.key==='ArrowDown'?1:-1) + items.length) % items.length;
      box.querySelectorAll('button').forEach((b,i)=> b.classList.toggle('sel', i===sel));
    } else if(e.key==='Enter' && items[sel]){ e.preventDefault(); close(); jumpToField(items[sel]); }
  });
  box.addEventListener('mousedown', (e)=>{
    const b = e.target.closest('button[data-i]'); if(!b) return;
    e.preventDefault(); close(); jumpToField(items[+b.dataset.i]);
  });
  document.addEventListener('click', (e)=>{ if(!e.target.closest('.gsearch')) close(); });
}
document.addEventListener('keydown', (e)=>{
  if(e.key!=='/' || e.ctrlKey || e.metaKey) return;
  if(/^(input|textarea|select)$/i.test(e.target.tagName) || e.target.isContentEditable) return;
  const i = document.getElementById('gsearch'); if(i){ e.preventDefault(); i.focus(); }
});

/* Ventana emergente con el texto completo de una causa (hover / toque / foco) */
(function(){
  let pop=null, hideT=null, curChip=null;
  function ensure(){ if(!pop){ pop=document.createElement('div'); pop.id='fb-pop'; document.body.appendChild(pop); } return pop; }
  function chipOf(t){ return t && t.closest ? t.closest('.fb-chip') : null; }
  function show(chip, tipText){
    clearTimeout(hideT);
    const inp = chip.querySelector('.fb-chip-input');
    const txt = ((inp&&inp.value)||'').trim();
    const sel = chip.classList.contains('selected');
    if(!txt && !tipText) return hide();
    const el=ensure(); curChip=chip;
    el.innerHTML = (txt?'<span class="fbp-text"></span>':'') + '<span class="fbp-hint"></span>';
    if(txt) el.querySelector('.fbp-text').textContent = txt;
    el.querySelector('.fbp-hint').textContent = tipText || (sel
      ? L('✓ Seleccionada: pasa a Priorización','✓ Selected: goes to Prioritization')
      : L('☐ Marca la casilla para llevarla a Priorización','☐ Tick the box to send it to Prioritization'));
    if(!txt) el.querySelector('.fbp-hint').style.cssText='border:0;margin:0;padding:0';
    el.classList.add('show');
    const r=chip.getBoundingClientRect(), w=el.offsetWidth, h=el.offsetHeight;
    let left=Math.min(Math.max(8, r.left), innerWidth-w-8);
    let top=r.top-h-8; if(top<8) top=r.bottom+8;
    el.style.left=left+'px'; el.style.top=top+'px';
  }
  function hide(){ if(pop) pop.classList.remove('show'); curChip=null; }
  document.addEventListener('mouseover', e=>{
    const chk=e.target.closest && e.target.closest('.fb-check');
    const c=chipOf(e.target); if(!c) return;
    show(c, chk ? chk.dataset.fbtip : null);
  });
  document.addEventListener('mouseout', e=>{ const c=chipOf(e.target); if(c && !c.contains(e.relatedTarget) && document.activeElement!==c.querySelector('.fb-chip-input')) hide(); });
  document.addEventListener('focusin', e=>{ const c=chipOf(e.target); if(c && e.target.classList.contains('fb-chip-input')) show(c); });
  document.addEventListener('focusout', e=>{ if(chipOf(e.target)) hide(); });
  document.addEventListener('input', e=>{ const c=chipOf(e.target); if(c && c===curChip) show(c); });
  document.addEventListener('touchstart', e=>{
    const c=chipOf(e.target);
    if(c && !e.target.closest('.fb-check') && !e.target.closest('.fb-chip-remove')){ show(c); clearTimeout(hideT); hideT=setTimeout(hide,3500); }
    else if(!c) hide();
  }, {passive:true});
  window.addEventListener('scroll', hide, {passive:true});
})();

const shFecha = f=>{ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(f||''); return m ? m[2]+'/'+m[3]+'/'+m[1] : ''; };
function shBuildData(){
  const st = state.statement, sh = state.shibumi || {};

  const clean = x=> (x||'').trim();

  const dates = acts.map(r=>r.date).filter(Boolean).sort();
  const situacion = join(

  );

/* ---- calculadora de impacto libre: variables con unidades fundamentales (tiempo, dinero, cantidad) ---- */
const shClp = n => n>0 ? '$'+Math.round(n).toLocaleString('es-CL') : '—';
const shN = v => +String(v==null?'':v).replace(',','.') || 0;
const SH_UNITS = { h:{n:'horas',s:'h'}, min:{n:'minutos',s:'min'}, clp:{n:'$ CLP',s:'CLP'}, usd:{n:'USD',s:'USD'}, un:{n:'cantidad (unidades, movimientos, veces)',s:'un'}, pct:{n:'porcentaje %',s:'%'} };
function shNewLine(){ return { id:uid(), nombre:'', modo:'calc', f:'', v2:true, factors:[{id:uid(),label:'',v:'',u:'clp'}] }; }
function shConvLine(l){ /* líneas de versiones anteriores → formato libre, sin supuestos ocultos */
  if(l.factors && l.v2) return l;
  if(!l.factors){
    const n=shNewLine(); n.id=l.id; n.modo=l.modo||'calc'; n.f=l.f||''; n.nombre=({hh:'Horas-hombre liberadas',prod:'Productividad',efi:'Eficiencia',costo:'Costo directo',tarifa:'Tarifas e ingresos'})[l.tipo]||'';
    const F={hh:[['HH liberadas por día','h'],['Días al año','un'],['Valor de la HH','clp']],prod:[['Unidades extra por día','un'],['Valor por unidad','clp'],['Días al año','un']],efi:[['Reducción','pct'],['Costo anual','clp']],costo:[['Ahorro cada vez','clp'],['Veces al año','un']],tarifa:[['Volumen anual','un'],['Mayor tarifa por unidad','clp']]}[l.tipo];
    if(F){ const vals={hh:[l.a,state.shibumi.dias||250,state.shibumi.valorHH||25000],prod:[l.a,l.b,state.shibumi.dias||250],efi:[l.a,l.b],costo:[l.a,l.b],tarifa:[l.a,l.b]}[l.tipo]; n.factors=F.map((x,i)=>({id:uid(),label:x[0],v:vals[i]==null?'':vals[i],u:x[1]})); }
    return n;
  }
  /* formato intermedio con "se repite" / valor HH automático → hacerlo explícito */
  const sh=state.shibumi, us=l.factors.map(f=>f.u);
  if(us.some(u=>u==='h'||u==='min') && !us.some(u=>u==='clp'||u==='usd')) l.factors.push({id:uid(),label:'Valor de la HH',v:sh.valorHH||25000,u:'clp'});
  const m={dia:[sh.dias||250,'Días al año'],sem:[52,'Semanas al año'],mes:[12,'Meses al año']}[l.per]; if(m) l.factors.push({id:uid(),label:m[1],v:m[0],u:'un'});
  delete l.per; l.v2=true; return l;
}
function shDefaults(){
  return { parent:'', scope:'', mode:'calc', impact:'', benefit:'', start:'', l4:'', l5:'', auto:false, url:'', open:false, actStart:'',
           tc:950, lines:[shNewLine()] };
}
function shFVal(f){ const v=shN(f.v), tc=shN(state.shibumi.tc)||950; return f.u==='pct'? v/100 : f.u==='min'? v/60 : f.u==='usd'? v*tc : v; }
const shIsFinal = l => l.modo==='final';
function shLineAnual(l){
  if(shIsFinal(l)) return shN(l.f);
  const fs=l.factors||[]; if(!fs.length || fs.some(f=>!String(f.v).trim())) return 0;
  return fs.reduce((a,f)=>a*shFVal(f),1);
}
function shLineFormula(l){
  return (l.factors||[]).map(f=>`${shN(f.v)} ${SH_UNITS[f.u].s}${f.label?' ('+f.label+')':''}`).join(' × ');
}
function shLineTxt(l){
  const nm=(l.nombre||'Impacto').trim();
  return shIsFinal(l) ? `${nm}: ${shClp(shN(l.f))} al año` : `${nm}: ${shLineFormula(l)} = ${shClp(shLineAnual(l))} al año`;
}
function shTotalCLP(){ return (state.shibumi.lines||[]).reduce((a,l)=>a+shLineAnual(l),0); }
function shBenefitCalc(){ const t=shTotalCLP(), tc=shN(state.shibumi.tc)||950; return t>0 ? Math.round(t/tc/1000*10)/10 : ''; }
function shImpactText(){
  const sh = state.shibumi;
  if(sh.mode!=='calc') return (sh.impact||'').trim();
  const lines = (sh.lines||[]).filter(l=>shLineAnual(l)>0);
  if(!lines.length) return '';
  const tc = shN(sh.tc)||950;
  return lines.map(shLineTxt).join('\n')+'\nTotal: '+shClp(shTotalCLP())+' al año (≈ '+shBenefitCalc()+' kUSD a $'+tc+'/USD)';
}
function shBenefit(){
  const sh = state.shibumi;
  return sh.mode==='calc' ? String(shBenefitCalc()) : String(sh.benefit||'').trim().replace(',','.');
}

    ${l.factors.length>1?`<button type="button" class="btn btn-sm il-del" data-action="sh-fx-del" data-lid="${l.id}" data-fid="${f.id}" title="${L('Quitar variable','Remove variable')}">✕</button>`:''}

}

function shMissing(){
  const d = shBuildData(), f = [];
  if(!d.titulo) f.push('Name'); if(!d.situacion) f.push('Current Situation'); if(!d.cambio) f.push('What Will We Change');
  if(!d.enfoque) f.push('Approach'); if(!d.impacto) f.push('Rough Calculation of Impact'); if(!d.beneficio) f.push('Estimated Annual Benefit');
  if(!d.inicio) f.push('Start Date'); if(!d.fin) f.push('Due Date L4'); if(!d.l5) f.push('Due Date L5');
  return f;
}
function shRuntime(DATA,MAP,MODO,AUTO){
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[*:]/g,' ').replace(/[^a-z0-9]+/g,' ').trim();
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const vis=e=>!!(e.offsetWidth||e.offsetHeight||e.getClientRects().length);
  const txt=id=>{const e=id&&document.getElementById(id);return e?e.textContent:'';};
  function etiqueta(el){
    const p=[];
    if(el.getAttribute('aria-label'))p.push(el.getAttribute('aria-label'));
    (el.getAttribute('aria-labelledby')||'').split(/\s+/).forEach(i=>p.push(txt(i)));
    if(el.labels)[...el.labels].forEach(l=>p.push(l.textContent));
    if(el.id){const l=document.querySelector('label[for="'+el.id.replace(/"/g,'\\"')+'"]');if(l)p.push(l.textContent);}
    const fc=el.closest('.MuiFormControl-root,.MuiTextField-root,.MuiAutocomplete-root,[class*="FormControl"]');
    if(fc){const l=fc.querySelector('label,legend');if(l)p.push(l.textContent);}
    if(el.placeholder)p.push(el.placeholder);
    if(el.name)p.push(el.name);
    return p.map(norm).filter(Boolean);}
  function esReq(el){const fc=el.closest('.MuiFormControl-root,.MuiTextField-root,.MuiAutocomplete-root,[class*="FormControl"]');let t='';
    if(fc)fc.querySelectorAll('label,legend').forEach(l=>{t+=l.textContent;});
    if(el.id){const l=document.querySelector('label[for="'+el.id.replace(/"/g,'\\"')+'"]');if(l)t+=l.textContent;}
    return /\*/.test(t)||!!el.required||el.getAttribute('aria-required')==='true';}
  function vacio(c){const el=c.el;if(el.closest('.MuiAutocomplete-root')&&el.closest('.MuiAutocomplete-root').querySelector('.MuiChip-root'))return false;
    const v=(c.sel?el.textContent:el.value||'').replace(/[\u200b\s-]/g,'');return !v;}
  function controles(){
    const dlg=[...document.querySelectorAll('[role=dialog]')].filter(vis).pop();
    const raiz=dlg||document;
    const sel='input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]),textarea,[role=combobox]:not(input),[aria-haspopup=listbox]:not(input)';
    const out=[];raiz.querySelectorAll(sel).forEach(el=>{
      if(!vis(el)||el.disabled||el.readOnly&&!el.closest('.MuiAutocomplete-root'))return;
      if(el.tagName==='TEXTAREA'&&el.getAttribute('aria-hidden')==='true')return;
      if(out.some(x=>x.el===el))return;
      const nat=el.tagName==='INPUT'||el.tagName==='TEXTAREA';
      const combo=!nat||el.getAttribute('role')==='combobox'||!!el.closest('.MuiAutocomplete-root');
      out.push({el,combo,sel:!nat,et:etiqueta(el),req:esReq(el)});});
    return out;}
  function poner(el,v){
    const proto=el.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:HTMLInputElement.prototype;
    const set=Object.getOwnPropertyDescriptor(proto,'value').set;
    el.focus();set.call(el,v);
    el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}
  async function opciones(){for(let i=0;i<10;i++){const o=[...document.querySelectorAll('[role=option]')].filter(vis);if(o.length)return o;await sleep(120);}return [];}
  async function elegir(c,v){
    const el=c.el,nv=norm(v);
    if(c.sel){el.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,button:0}));}
    else{el.focus();el.click();poner(el,v);}
    const ops=await opciones();
    let o=ops.find(x=>norm(x.textContent)===nv)||ops.find(x=>norm(x.textContent).includes(nv)||nv.includes(norm(x.textContent)));
    if(!o){document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));el.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
      return 'sin opción "'+v+'" (opciones: '+ops.slice(0,6).map(x=>x.textContent.trim()).join(' | ')+')';}
    o.click();await sleep(150);return 'ok';}
  const clicable=e=>e.closest('a,button,[role=button],[role=menuitem],li,[class*="ListItem"],[class*="MenuItem"]')||e;
  function clic(el){['pointerdown','mousedown','pointerup','mouseup','click'].forEach(t=>el.dispatchEvent(new MouseEvent(t,{bubbles:true,cancelable:true,view:window})));}
  const hayForm=()=>controles().some(c=>c.et.some(e=>e==='name'||e==='nombre'));
  async function abrirForm(){
    if(hayForm())return true;
    const pool=()=>[...document.querySelectorAll('a,button,li,div,span,p')].filter(vis);
    const cn=pool().filter(e=>norm(e.textContent)==='create new').sort((a,b)=>a.textContent.length-b.textContent.length)[0];
    if(cn){clic(clicable(cn));await sleep(600);}
    const it=pool().filter(e=>{const t=norm(e.textContent);return t==='initiative'||(t.startsWith('initiative ')&&t.length<70);}).sort((a,b)=>a.textContent.length-b.textContent.length)[0];
    if(!it){console.warn('No pude abrir Create New → Initiative: ábrelo tú y vuelve a pegar.');return false;}
    clic(clicable(it));
    for(let k=0;k<40;k++){await sleep(150);if(hayForm()){await sleep(300);return true;}}
    console.warn('El formulario no se abrió a tiempo.');return false;}
  async function llenar(d){
    const ctrl=controles(),usados=new Set(),rep=[];
    for(const m of MAP){
      if(!m.on)continue;const v=d[m.k];
      if(v==null||String(v).trim()===''){rep.push({campo:m.n,estado:'vacío en Origen',valor:''});continue;}
      const al=m.al.split(',').map(norm).filter(Boolean);
      let c=ctrl.find(x=>!usados.has(x.el)&&x.et.some(e=>al.includes(e)))||ctrl.find(x=>!usados.has(x.el)&&x.et.some(e=>al.some(a=>a.length>3&&e.includes(a))));
      if(!c){rep.push({campo:m.n,estado:'NO ENCONTRADO (alias: '+m.al+')',valor:''});continue;}
      usados.add(c.el);
      try{let r='ok';if(c.combo||c.sel)r=await elegir(c,String(v));else poner(c.el,String(v));
        rep.push({campo:m.n,estado:r==='ok'?'✔ lleno':'✖ '+r,control:c.et[0]||'?',valor:String(v).slice(0,40)});}
      catch(e){rep.push({campo:m.n,estado:'✖ error '+e.message,valor:''});}
      await sleep(80);}
    console.table(rep);
    const mal=rep.filter(r=>!/lleno|vacío/.test(r.estado)).length;
    if(AUTO){
      const falt=ctrl.filter(c=>c.req&&vacio(c)).map(c=>c.et[0]||'?');
      if(mal||falt.length){console.warn('No pulsé Create: '+(falt.length?'faltan obligatorios ('+falt.join(', ')+')':'hay campos sin llenar')+'. Complétalos y pulsa Create tú.');}
      else{const raiz=[...document.querySelectorAll('[role=dialog]')].filter(vis).pop()||document;
        const b=[...raiz.querySelectorAll('button')].find(x=>/^(create|crear)$/.test(norm(x.textContent)));
        if(b){await sleep(400);b.click();console.log('✔ Create pulsado automáticamente.');return true;}else console.warn('No encontré el botón Create: púlsalo tú.');}
      return false;}
    console.log(mal?'⚠ '+mal+' campo(s) sin llenar: corrige el alias en Origen (Datos → Shibumi) o complétalos a mano. Revisa y pulsa Create tú mismo.':'✔ Listo. Revisa los datos y pulsa Create tú mismo.');}
  function leer(){
    const r=controles().map(c=>({etiqueta:c.et[0]||'(sin etiqueta)',tipo:c.sel?'lista':c.combo?'autocompletar':'texto',todas:c.et.join(' | ')}));
    console.table(r);console.log('Copia esta tabla y envíasela a quien mantiene Origen para ajustar los alias.');return r;}
  if(MODO==='leer'){leer();return;}
  let i=0;
  const cerrado=async()=>{for(let k=0;k<60;k++){await sleep(200);if(![...document.querySelectorAll('[role=dialog]')].some(vis))return true;}return false;};
  window.origenLlenar=async n=>{if(typeof n==='number')i=n;
    while(DATA[i]){const d=DATA[i];console.log('Llenando '+(i+1)+'/'+DATA.length+': '+d.codigo+' — '+d.titulo);
      if(!(await abrirForm()))return;
      const creada=await llenar(d);i++;
      if(AUTO&&creada&&DATA[i]){await cerrado();await sleep(800);continue;}
      if(DATA[i])console.log('Para la siguiente ejecuta: origenLlenar('+i+')');break;}
    if(!DATA[i])console.log('Terminé todas las oportunidades.');};
  window.origenLlenar(0);
}

}

   plantilla PORT_TEMPLATE_ENG.xlsx tal cual (embebida en este
   mismo archivo HTML) y solo reemplaza el XML de las celdas de
   datos, dejando absolutamente todo lo demás —formas, colores,
   imágenes, estilos, otras hojas— intacto byte por byte.
   ============================================================ */

const XLSX_SHEET_FILES = {
  'PROBLEM STATEMENT': 'xl/worksheets/sheet1.xml',
  'CAUSE - EFFECT': 'xl/worksheets/sheet2.xml',
  'MULTI-VOTING MATRIX': 'xl/worksheets/sheet3.xml',
  '5 WHYS': 'xl/worksheets/sheet4.xml',
  'COUNTERMEASURES': 'xl/worksheets/sheet5.xml',
};

function xlColLetter(n){ let s=''; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }
function xlColLettersToNum(letters){
  let n = 0;
  for(const ch of letters) n = n*26 + (ch.charCodeAt(0)-64);
  return n;
}
function xlParseCoord(coord){
  const m = /^([A-Z]+)(\d+)$/.exec(coord);
  return { letters:m[1], row:parseInt(m[2],10), col:xlColLettersToNum(m[1]) };
}
function xlEscXml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// value_type: 'str' | 'num' | 'bool'
function xlMakeCell(coord, value, styleAttr, valueType){
  const sAttr = (styleAttr!=null) ? ` s="${styleAttr}"` : '';
  if(valueType==='fstr'){
    return `<c r="${coord}"${sAttr} t="str"><f>${xlEscXml(value.f)}</f><v>${xlEscXml(value.v)}</v></c>`;
  } else if(valueType==='fnum'){
    return `<c r="${coord}"${sAttr}><f>${xlEscXml(value.f)}</f><v>${value.v}</v></c>`;
  } else if(valueType==='str'){
    return `<c r="${coord}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${xlEscXml(value)}</t></is></c>`;
  } else if(valueType==='bool'){
    return `<c r="${coord}"${sAttr} t="b"><v>${value?1:0}</v></c>`;
  } else {
    return `<c r="${coord}"${sAttr}><v>${value}</v></c>`;
  }
}
// Reemplaza (o crea) una celda dentro del XML de una <row>...</row> completa.
function xlSetCellInRow(rowXml, coord, value, valueType){
  const rowMatch = /^(<row [^>]*>)([\s\S]*)(<\/row>)$/.exec(rowXml);
  const openTag = rowMatch[1], cellsXml = rowMatch[2], closeTag = rowMatch[3];

  const cellRe = /<c r="([A-Z]+\d+)"[^>]*?(?:\/>|>[\s\S]*?<\/c>)/g;
  const cells = [];
  let m;
  while((m = cellRe.exec(cellsXml))){ cells.push([m[1], m[0]]); }

  const targetCol = xlParseCoord(coord).col;
  let found = false;
  const newCells = cells.map(([cCoord, cXml])=>{
    if(cCoord === coord){
      found = true;
      const styleM = /s="(\d+)"/.exec(cXml);
      const styleAttr = styleM ? styleM[1] : null;
      return xlMakeCell(coord, value, styleAttr, valueType);
    }
    return cXml;
  });

  if(!found){
    const newCell = xlMakeCell(coord, value, null, valueType);
    let insertAt = newCells.length;
    for(let i=0;i<cells.length;i++){
      if(xlParseCoord(cells[i][0]).col > targetCol){ insertAt = i; break; }
    }
    newCells.splice(insertAt, 0, newCell);
  }
  return openTag + newCells.join('') + closeTag;
}
// Establece el valor de una celda en el XML completo de una hoja,
// creando la fila si hace falta. Nunca toca ninguna otra parte del
// archivo (dibujos, imágenes, estilos, otras hojas).
function xlSetCellValue(sheetXml, coord, value, valueType){
  valueType = valueType || 'str';
  const { row: rowNum } = xlParseCoord(coord);
  const sdMatch = /(<sheetData>)([\s\S]*?)(<\/sheetData>)/.exec(sheetXml);
  const openSd = sdMatch[1], inner = sdMatch[2], closeSd = sdMatch[3];

  const rowRe = /<row r="(\d+)"[^>]*>[\s\S]*?<\/row>|<row r="(\d+)"[^>]*\/>/g;
  const rows = [];
  let m;
  while((m = rowRe.exec(inner))){ rows.push([parseInt(m[1]||m[2],10), m[0]]); }

  let found = false;
  const newRows = rows.map(([rNum, rXml])=>{
    if(rNum === rowNum){
      found = true;
      if(rXml.endsWith('/>')) rXml = rXml.slice(0,-2) + '></row>';
      return xlSetCellInRow(rXml, coord, value, valueType);
    }
    return rXml;
  });

  if(!found){
    const newRow = `<row r="${rowNum}">` + xlMakeCell(coord, value, null, valueType) + `</row>`;
    let insertAt = newRows.length;
    for(let i=0;i<rows.length;i++){
      if(rows[i][0] > rowNum){ insertAt = i; break; }
    }
    newRows.splice(insertAt, 0, newRow);
  }

  const newInner = newRows.join('');
  return sheetXml.slice(0, sdMatch.index) + openSd + newInner + closeSd + sheetXml.slice(sdMatch.index + sdMatch[0].length);
}

function base64ToUint8Array(b64){
  const binStr = atob(b64);
  const bytes = new Uint8Array(binStr.length);
  for(let i=0;i<binStr.length;i++) bytes[i] = binStr.charCodeAt(i);
  return bytes;
}

    stats.forEach(([n,l],i)=>{
      const x = 0.9 + i*2.9;
      s.addShape(SH.roundRect, { x, y:4.85, w:2.65, h:1.55, rectRadius:0.14, fill:{color:NAVY2}, line:{color:'2E5A9E', width:1} });
      s.addText(String(n), { x:x+0.2, y:4.95, w:2.25, h:0.9, fontSize:44, bold:true, color:WHITE, valign:'middle' });
      s.addText(l, { x:x+0.2, y:5.8, w:2.3, h:0.45, fontSize:13, bold:true, color:'FFB27D', valign:'middle' });
    });
    s.addText(new Date().toLocaleDateString(L('es-ES','en-US'), { year:'numeric', month:'long', day:'numeric' }), { x:0.9, y:6.85, w:6, h:0.35, fontSize:12, color:WHITE });
  }

  /* ---------- 2. Planteamiento ---------- */
  {
    const s = baseSlide('1', 'Problema', 'Planteamiento del problema');
    const comps = [
      ['Tendencia', st.trend, 'E8821C'], ['Proceso', st.process, '7C4FD9'], ['Situación actual', st.currentSituation, '178A53'],
      ['Situación deseada', st.desiredSituation, '1F6FD1'], ['Brecha', st.gap, 'D93B3B'],
    ];
    const cw = 2.3, gap = 0.157;
    comps.forEach(([lab,val,col],i)=>{
      const x = 0.6 + i*(cw+gap);
      s.addShape(SH.roundRect, { x, y:1.65, w:cw, h:1.5, rectRadius:0.1, fill:{color:SOFT}, line:{color:LINE, width:1} });
      s.addShape(SH.roundRect, { x, y:1.65, w:cw, h:0.38, rectRadius:0.1, fill:{color:col}, line:{type:'none'} });
      s.addText(lab.toUpperCase(), { x, y:1.65, w:cw, h:0.38, fontSize:10.5, bold:true, color:WHITE, align:'center', valign:'middle', charSpacing:1 });
      s.addText(clip(val,80) || '—', { x:x+0.1, y:2.08, w:cw-0.2, h:1.02, fontSize:fs(val,[[30,13],[60,11.5],[999,10.5]]), color:INK, valign:'middle', align:'center', fit:'shrink' });
    });
    s.addShape(SH.roundRect, { x:0.6, y:3.4, w:7.6, h:3.45, rectRadius:0.12, fill:{color:SOFT}, line:{color:LINE, width:1} });
    s.addShape(SH.rect, { x:0.6, y:3.55, w:0.09, h:3.15, fill:{color:ORANGE}, line:{type:'none'} });
    s.addText('PLANTEAMIENTO DEL PROBLEMA', { x:0.9, y:3.5, w:6.8, h:0.35, fontSize:11, bold:true, color:ORANGE, charSpacing:2 });
    const stm = st.statementText || 'Sin definir';
    s.addText(stm, { x:0.9, y:3.9, w:7.1, h:2.85, fontSize:fs(stm,[[160,20],[300,17],[500,14.5],[999,12.5]]), color:INK, valign:'top', italic:!st.statementText, fit:'shrink' });
    s.addText('SÍNTOMAS', { x:8.5, y:3.4, w:4.2, h:0.35, fontSize:11, bold:true, color:ORANGE, charSpacing:2 });
    const symShow = symptoms.length ? symptoms.slice(0,6) : ['Sin síntomas registrados'];
    const rh = Math.min(0.62, 3.0/symShow.length);
    symShow.forEach((t,i)=>{
      const y = 3.8 + i*(rh+0.05);
      s.addShape(SH.roundRect, { x:8.5, y, w:4.23, h:rh, rectRadius:0.08, fill:{color:WHITE}, line:{color:LINE, width:1} });
      s.addText(symptoms.length ? String(i+1) : '–', { x:8.58, y:y+(rh-0.34)/2, w:0.34, h:0.34, shape:SH.ellipse, fill:{color:BLUE}, fontSize:11, bold:true, color:WHITE, align:'center', valign:'middle' });
      s.addText(clip(t,85), { x:9.0, y, w:3.65, h:rh, fontSize:fs(t,[[45,12],[999,10.5]]), color:INK, valign:'middle', fit:'shrink' });
    });
    if(symptoms.length>6) s.addText(L(`+ ${symptoms.length-6} síntomas más`,`+ ${symptoms.length-6} more symptoms`), { x:8.5, y:6.62, w:4.2, h:0.25, fontSize:10, bold:true, color:BLUE });
  }

  /* ---------- 2b. Evidencia (si hay imágenes) ---------- */
  const ev = (st.evidence||[]).filter(e=>e && e.dataUrl).slice(0,6);
  if(ev.length){
    const s = baseSlide('1', 'Problema', 'Evidencia fotográfica');
    const cols = ev.length<=2 ? ev.length : 3, rowsN = Math.ceil(ev.length/cols);
    const gw = 12.13, gh = 5.35, gx = 0.6, gy = 1.6, g = 0.2;
    const w = (gw-(cols-1)*g)/cols, h = (gh-(rowsN-1)*g)/rowsN;
    ev.forEach((e,i)=>{
      const x = gx + (i%cols)*(w+g), y = gy + Math.floor(i/cols)*(h+g);
      s.addShape(SH.roundRect, { x, y, w, h, rectRadius:0.1, fill:{color:SOFT}, line:{color:LINE, width:1} });
      try{ s.addImage({ data:e.dataUrl, x:x+0.08, y:y+0.08, w:w-0.16, h:h-0.16, sizing:{ type:'contain', w:w-0.16, h:h-0.16 } }); }catch(err){}
    });
  }

  /* ---------- 3. Ishikawa ---------- */
  {
    const s = baseSlide('2', 'Ishikawa', 'Diagrama causa-efecto');
    const spineY = 4.28;
    s.addShape(SH.line, { x:0.6, y:spineY, w:9.75, h:0, line:{ color:NAVY, width:3.5, endArrowType:'triangle' } });
    s.addText([{ text:'PROBLEMA', options:{ bold:true, fontSize:14, color:'FFB27D', breakLine:true } }, { text:clip(project,60), options:{ bold:true, fontSize:13, color:WHITE } }],
      { x:10.4, y:spineY-0.75, w:2.33, h:1.5, shape:SH.roundRect, rectRadius:0.14, fill:{color:NAVY}, align:'center', valign:'middle', margin:6 });
    const slots = { people:[0.8,true], machine:[4.0,true], environment:[7.2,true], material:[0.8,false], process:[4.0,false], measurement:[7.2,false] };
    REF.ishikawaCategories.forEach(cat=>{
      const [x0, top] = slots[cat.key]; const col = CAT[cat.key];
      const list = state.ishikawa[cat.key].filter(c=>c.text.trim());
      const shown = list.slice(0,4);
      const pillY = top ? 1.62 : 6.4;
      s.addText(cat.name.toUpperCase(), { x:x0, y:pillY, w:2.55, h:0.4, shape:SH.roundRect, rectRadius:0.2, fill:{color:col}, fontSize:12, bold:true, color:WHITE, align:'center', valign:'middle', charSpacing:1.5 });
      if(top) s.addShape(SH.line, { x:x0+0.1, y:pillY+0.4, w:0.95, h:spineY-(pillY+0.4), line:{ color:col, width:2.5 } });
      else s.addShape(SH.line, { x:x0+0.1, y:spineY, w:0.95, h:pillY-spineY, flipV:true, line:{ color:col, width:2.5 } });
      shown.forEach((c,i)=>{
        const y = top ? pillY+0.5+i*0.46 : pillY-0.5-0.38-i*0.46 + 0.0;
        const yy = top ? y : pillY - 0.46*(i+1) - 0.04;
        s.addText(clip(c.text,46), { x:x0+0.62, y:yy, w:2.2, h:0.38, shape:SH.roundRect, rectRadius:0.08,
          fill:{color:c.selected?ORANGE:WHITE}, line:{color:c.selected?ORANGE:col, width:1.25},
          fontSize:fs(c.text,[[24,10.5],[999,9]]), bold:!!c.selected, color:c.selected?WHITE:INK, valign:'middle', margin:3, fit:'shrink' });
      });
      if(list.length>4){
        const yy = top ? pillY+0.5+4*0.46 : pillY-0.46*5-0.04;
        s.addText(L(`+${list.length-4} más`,`+${list.length-4} more`), { x:x0+0.62, y:yy, w:2.2, h:0.3, fontSize:10, bold:true, color:col });
      }
    });
    s.addShape(SH.roundRect, { x:10.45, y:5.85, w:0.28, h:0.22, rectRadius:0.05, fill:{color:ORANGE}, line:{type:'none'} });
    s.addText('Seleccionada para priorizar', { x:10.8, y:5.8, w:2.0, h:0.32, fontSize:10, bold:true, color:INK, valign:'middle' });
    s.addShape(SH.roundRect, { x:10.45, y:6.2, w:0.28, h:0.22, rectRadius:0.05, fill:{color:WHITE}, line:{color:NAVY, width:1.25} });
    s.addText('Causa identificada', { x:10.8, y:6.15, w:2.0, h:0.32, fontSize:10, bold:true, color:INK, valign:'middle' });
  }

  /* ---------- 4. Priorización ---------- */
  {
    const s = baseSlide('3', 'Priorización', 'Matriz de priorización de causas');
    const rows = state.matrixRows.slice(0,10);
    if(!rows.length){ emptyNote(s, 'Aún no hay causas priorizadas.'); }
    else {
      const top = 1.7, avail = 5.15, rh = Math.min(0.62, avail/rows.length);
      s.addText('CAUSA', { x:0.6, y:top-0.02, w:3.6, h:0.28, fontSize:10, bold:true, color:ORANGE, charSpacing:2 });
      ['I','F','C','E'].forEach((l,i)=> s.addText(l, { x:4.35+i*0.46, y:top-0.02, w:0.4, h:0.28, fontSize:10, bold:true, color:ORANGE, align:'center' }));
      s.addText('PUNTAJE (1–3)', { x:6.3, y:top-0.02, w:3.4, h:0.28, fontSize:10, bold:true, color:ORANGE, charSpacing:2 });
      rows.forEach((r,i)=>{
        const y = top+0.3+i*rh, bh = rh-0.08;
        const band = r.total===null ? NAVY : r.total>=REF.scoreThresholds.review ? GREEN : r.total>=REF.scoreThresholds.low ? AMBER : RED;
        s.addShape(SH.roundRect, { x:0.6, y, w:9.75, h:bh, rectRadius:0.08, fill:{color:i%2?WHITE:SOFT}, line:{color:LINE, width:0.75} });
        s.addText(clip(r.causeText,70), { x:0.72, y, w:3.55, h:bh, fontSize:fs(r.causeText,[[34,12],[999,10.5]]), bold:true, color:INK, valign:'middle', fit:'shrink' });
        [r.influence,r.frequency,r.control,r.evidence].forEach((v,k)=>{
          s.addText(v==null?'–':String(v), { x:4.37+k*0.46, y:y+(bh-0.34)/2, w:0.36, h:0.34, shape:SH.roundRect, rectRadius:0.07, fill:{color:v==null?WHITE:SKY}, line:{color:LINE, width:0.75}, fontSize:12, bold:true, color:INK, align:'center', valign:'middle' });
        });
        const tr = 2.55, bx = 6.3, by = y+(bh-0.24)/2;
        s.addShape(SH.roundRect, { x:bx, y:by, w:tr, h:0.24, rectRadius:0.12, fill:{color:LINE}, line:{type:'none'} });
        if(r.total!==null) s.addShape(SH.roundRect, { x:bx, y:by, w:Math.max(0.3, tr*r.total/3), h:0.24, rectRadius:0.12, fill:{color:band}, line:{type:'none'} });
        s.addText(r.total===null?'—':r.total.toFixed(2), { x:bx+tr+0.08, y, w:0.7, h:bh, fontSize:13, bold:true, color:band, valign:'middle' });
        if(r.pass) s.addText('PASA', { x:9.6, y:y+(bh-0.3)/2, w:0.66, h:0.3, shape:SH.roundRect, rectRadius:0.15, fill:{color:GREEN}, fontSize:9.5, bold:true, color:WHITE, align:'center', valign:'middle' });
      });
      // criterios
      s.addShape(SH.roundRect, { x:10.55, y:1.7, w:2.18, h:5.15, rectRadius:0.12, fill:{color:NAVY}, line:{type:'none'} });
      s.addText('CRITERIOS', { x:10.7, y:1.82, w:1.9, h:0.3, fontSize:11, bold:true, color:'FFB27D', charSpacing:2 });
      const crit = [['I','Influencia','40%'],['F','Frecuencia','30%'],['C','Control','20%'],['E','Evidencia','10%']];
      crit.forEach(([k,n,w],i)=>{
        const y = 2.25+i*0.72;
        s.addText(k, { x:10.7, y, w:0.42, h:0.42, shape:SH.roundRect, rectRadius:0.09, fill:{color:BLUE}, fontSize:13, bold:true, color:WHITE, align:'center', valign:'middle' });
        s.addText([{ text:n, options:{ bold:true, fontSize:12, color:WHITE, breakLine:true } }, { text:L('Peso ','Weight ')+w, options:{ fontSize:10.5, color:'FFB27D', bold:true } }], { x:11.2, y:y-0.06, w:1.5, h:0.55, valign:'middle' });
      });
      s.addShape(SH.line, { x:10.7, y:5.2, w:1.85, h:0, line:{ color:'2E5A9E', width:1 } });
      s.addText([
        { text:'≥ 2.5  ', options:{ bold:true, color:'7FE0B0', fontSize:11 } }, { text:'pasa a 5 Porqués', options:{ color:WHITE, fontSize:10.5, breakLine:true } },
        { text:'2.0–2.4  ', options:{ bold:true, color:'FFD27A', fontSize:11 } }, { text:'validar', options:{ color:WHITE, fontSize:10.5, breakLine:true } },
        { text:'< 2.0  ', options:{ bold:true, color:'FF9A9A', fontSize:11 } }, { text:'baja prioridad', options:{ color:WHITE, fontSize:10.5 } },
      ], { x:10.7, y:5.3, w:1.95, h:1.4, valign:'top', paraSpaceAfter:5 });
    }
  }

  /* ---------- 5. 5 Porqués (una lámina por causa) ---------- */
  if(!state.whyGroups.length){
    const s = baseSlide('4', '5 Porqués', 'Análisis de causa raíz');
    emptyNote(s, 'Aún no hay causas en el análisis de 5 Porqués.');
  }
  state.whyGroups.slice(0,10).forEach((g, gi)=>{
    const s = baseSlide('4', L('5 Porqués · Causa '+(gi+1)+' de '+state.whyGroups.length,'5 Whys · Cause '+(gi+1)+' of '+state.whyGroups.length), 'Cadena de causalidad');
    s.addShape(SH.roundRect, { x:0.6, y:1.55, w:12.13, h:0.7, rectRadius:0.12, fill:{color:NAVY}, line:{type:'none'} });
    s.addText([{ text:'CAUSA PRIORIZADA   ', options:{ bold:true, fontSize:11, color:'FFB27D', charSpacing:2 } }, { text:clip(g.causeText,120), options:{ bold:true, fontSize:fs(g.causeText,[[70,16],[999,13]]), color:WHITE } }],
      { x:0.8, y:1.55, w:11.8, h:0.7, valign:'middle', fit:'shrink' });
    const keys = ['A','B','C'].filter(k=> g.paths[k] && (g.paths[k].levels.some(l=>l.text.trim()) || g.paths[k].rootCause.trim()));
    const paths = keys.length ? keys : ['A'];
    const rowH = Math.min(2.05, 4.6/paths.length), top = 2.5, boxH = rowH-0.16;
    paths.forEach((pk, pi)=>{
      const p = g.paths[pk] || { levels:[], rootCause:'', closed:false };
      const y = top + pi*rowH;
      s.addText(pk, { x:0.6, y:y+(boxH-0.55)/2, w:0.55, h:0.55, shape:SH.ellipse, fill:{color:BLUE}, fontSize:18, bold:true, color:WHITE, align:'center', valign:'middle' });
      const lv = p.levels.filter(l=>l.text.trim());
      const items = lv.map((l,i)=>({ kind:'why', n:i+1, t:l.text }));
      if(p.rootCause.trim()) items.push({ kind:'root', t:p.rootCause });
      if(!items.length) items.push({ kind:'why', n:1, t:'' });
      const n = items.length, ax = 1.3, aw = 12.73-ax, arrow = 0.24;
      const bw = Math.min(2.5, (aw-(n-1)*arrow)/n);
      items.forEach((it,i)=>{
        const x = ax + i*(bw+arrow);
        const root = it.kind==='root';
        s.addShape(SH.roundRect, { x, y, w:bw, h:boxH, rectRadius:0.1, fill:{color:root?ORANGE:SOFT}, line:{color:root?ORANGE:LINE, width:1} });
        s.addText(root?'CAUSA RAÍZ':L('¿POR QUÉ? ','WHY? ')+it.n, { x, y, w:bw, h:0.34, fontSize:10.5, bold:true, color:root?WHITE:BLUE, align:'center', valign:'middle', charSpacing:1.5 });
        s.addText(it.t ? clip(it.t,125) : '—', { x:x+0.08, y:y+0.34, w:bw-0.16, h:boxH-0.38, fontSize:fs(it.t,[[40,15],[75,13],[999,11.5]]), bold:root, color:root?WHITE:INK, valign:'middle', align:'center', fit:'shrink' });
        if(i<n-1) s.addShape(SH.rightArrow, { x:x+bw+0.03, y:y+boxH/2-0.12, w:arrow-0.06, h:0.24, fill:{color:ORANGE}, line:{type:'none'} });
      });
    });
  });

  /* ---------- 6. Causas raíz ---------- */
  {
    const s = baseSlide('4', '5 Porqués', 'Causas raíz identificadas');
    if(!roots.length){ emptyNote(s, 'Aún no hay causas raíz confirmadas.'); }
    else {
      const show = roots.slice(0,8), cols = show.length>4 ? 2 : 1;
      const rowsN = Math.ceil(show.length/cols), g = 0.2, cw = (12.13-(cols-1)*g)/cols, ch = Math.min(1.25,(5.3-(rowsN-1)*g)/rowsN);
      show.forEach((r,i)=>{
        const x = 0.6 + (i%cols)*(cw+g), y = 1.65 + Math.floor(i/cols)*(ch+g);
        s.addShape(SH.roundRect, { x, y, w:cw, h:ch, rectRadius:0.12, fill:{color:SOFT}, line:{color:LINE, width:1} });
        s.addShape(SH.rect, { x, y:y+0.12, w:0.09, h:ch-0.24, fill:{color:ORANGE}, line:{type:'none'} });
        s.addText(String(i+1), { x:x+0.25, y:y+(ch-0.55)/2, w:0.55, h:0.55, shape:SH.ellipse, fill:{color:ORANGE}, fontSize:18, bold:true, color:WHITE, align:'center', valign:'middle' });
        s.addText([{ text:clip(r.rootCause,170), options:{ bold:true, fontSize:fs(r.rootCause,[[60,16],[110,14],[999,12]]), color:INK, breakLine:true } },
                   { text:L('Origen: ','Source: ')+clip(r.causeText,80)+L(' (ruta ',' (path ')+r.pathKey+')', options:{ fontSize:10.5, bold:true, color:BLUE } }],
          { x:x+0.95, y, w:cw-1.1, h:ch, valign:'middle', fit:'shrink' });
      });
      if(roots.length>8) s.addText(L(`+ ${roots.length-8} causas raíz más`,`+ ${roots.length-8} more root causes`), { x:0.6, y:6.8, w:6, h:0.25, fontSize:10, bold:true, color:BLUE });
    }
  }

  /* ---------- 7. Plan de acción ---------- */
  {
    const mit = actions.filter(a=>a.type==='mitigation'), eli = actions.filter(a=>a.type!=='mitigation');
    const per = 4, pages = Math.max(1, Math.ceil(Math.max(mit.length, eli.length)/per));
    for(let pg=0; pg<pages; pg++){
      const s = baseSlide('5', 'Plan de acción', 'Acciones definidas' + (pages>1 ? ` (${pg+1}/${pages})` : ''));
      if(!actions.length){ emptyNote(s, 'Aún no hay acciones definidas.'); continue; }
      [['MITIGACIÓN','contiene el problema mientras se implementa la solución', mit, AMBER, 0.6],
       ['ELIMINACIÓN DE CAUSA RAÍZ','ataca la causa de forma permanente', eli, GREEN, 6.78]].forEach(([title,sub,list,col,x])=>{
        const w = 5.95;
        s.addShape(SH.roundRect, { x, y:1.6, w, h:0.62, rectRadius:0.1, fill:{color:col}, line:{type:'none'} });
        s.addText([{ text:title, options:{ bold:true, fontSize:13, color:WHITE, charSpacing:1.5, breakLine:true } }, { text:sub, options:{ fontSize:9.5, color:WHITE, bold:true } }], { x:x+0.2, y:1.6, w:w-0.3, h:0.62, valign:'middle' });
        const chunk = list.slice(pg*per, pg*per+per);
        if(!chunk.length){
          s.addText(pg===0 ? 'Sin acciones de este tipo' : '—', { x, y:2.4, w, h:1.2, shape:SH.roundRect, rectRadius:0.1, fill:{color:WHITE}, line:{color:LINE, width:1.25, dashType:'dash'}, fontSize:13, bold:true, color:NAVY, align:'center', valign:'middle' });
        }
        const nmax = Math.max(1, Math.min(per, Math.max(mit.length-pg*per, eli.length-pg*per)));
        const hh = Math.min(1.6, 4.55/nmax - 0.1);
        chunk.forEach((a,i)=>{
          const y = 2.38 + i*(hh+0.1), h = hh;
          s.addShape(SH.roundRect, { x, y, w, h, rectRadius:0.1, fill:{color:SOFT}, line:{color:LINE, width:1} });
          s.addShape(SH.rect, { x, y:y+0.1, w:0.08, h:h-0.2, fill:{color:col}, line:{type:'none'} });
          s.addText([{ text:L('CAUSA RAÍZ: ','ROOT CAUSE: ')+clip(a.rootCause||'—',70), options:{ bold:true, fontSize:hh>1.2?11:9.5, color:BLUE, breakLine:true } },
                     { text:clip(a.action,130), options:{ bold:true, fontSize:fs(a.action,hh>1.2?[[60,16],[999,13]]:[[60,13],[999,11]]), color:INK, breakLine:true } },
                     { text:L('Responsable: ','Owner: ')+(a.responsible||'—')+'   ·   '+L('Fecha: ','Date: ')+fmtDate(a.date), options:{ fontSize:hh>1.2?12:10, bold:true, color:NAVY } }],
            { x:x+0.2, y, w:w-0.3, h, valign:'middle', fit:'shrink', paraSpaceAfter:2 });
        });
      });
    }
  }

  await pptx.writeFile({ fileName: (state.projectName||'problem_solving').replace(/[^a-z0-9]+/gi,'_')+'.pptx' });
}


/* ---------- Plantilla de Excel (se lee de la carpeta files) ---------- */
function pickTemplateFile(){
  return new Promise(resolve=>{
    psModal('tpl-modal', `<h3>${L('Selecciona el Excel en blanco','Select the blank Excel')}</h3>
      <p class="help-p">${L('No se pudo leer la plantilla desde la carpeta files (normal si abriste esta página como archivo local). Selecciónala desde tu computador:','The template could not be read from the files folder (normal if you opened this page as a local file). Select it from your computer:')}</p>
      <label class="btn btn-primary" style="cursor:pointer;display:inline-flex;margin-top:8px;">${L('Elegir archivo…','Choose file…')}<input type="file" id="tpl-input" accept=".xlsx" style="display:none;"></label>`);
    const m=document.getElementById('tpl-modal');
    const done=(v)=>{ m.classList.remove('open'); resolve(v); };
    m.querySelector('#tpl-input').onchange = async e=>{ const f=e.target.files[0]; if(!f) return done(null); try{ done(await JSZip.loadAsync(await f.arrayBuffer())); }catch(err){ showToast(L('Archivo no válido','Invalid file'),true); done(null); } };
    m.onclick = e=>{ if(e.target===m || e.target.hasAttribute('data-close')) done(null); };
  });
}
async function loadExcelTemplate(){
  const order = LANG==='en' ? ['en','es'] : ['es','en'];
  for(const l of order){
    try{
      const r = await fetch(PS_CONFIG.excel[l], {cache:'no-cache'});
      if(!r.ok) continue;
      const zip = await JSZip.loadAsync(await r.arrayBuffer());
      if(l!==LANG) showToast(L('No encontré la plantilla en español; usé la de inglés','English template not found; used the Spanish one'), true);
      return zip;
    }catch(e){}
  }
  return await pickTemplateFile();
}
async function resolveSheets(zip){
  const out = {};
  const unesc = t=> String(t).replace(/&amp;/g,'&').replace(/&apos;/g,"'").replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  const wb = await zip.file('xl/workbook.xml').async('string');
  const rels = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const relMap = {};
  (rels.match(/<Relationship [^>]*>/g)||[]).forEach(r=>{ const id=/Id="([^"]+)"/.exec(r), t=/Target="([^"]+)"/.exec(r); if(id&&t) relMap[id[1]] = t[1].replace(/^\/?(xl\/)?/,'xl/'); });
  const sheets = (wb.match(/<sheet [^>]*>/g)||[]).map(t=>({ name:unesc((/name="([^"]*)"/.exec(t)||[])[1]||''), file:relMap[(/r:id="([^"]+)"/.exec(t)||[])[1]] }));
  Object.keys(XLSX_SHEET_FILES).forEach(key=>{
    let f = sheets.find(x=> x.name.trim().toUpperCase()===key);
    const file = f ? f.file : XLSX_SHEET_FILES[key];
    const byFile = sheets.find(x=>x.file===file);
    out[key] = { file, name: byFile ? byFile.name : key };
  });
  return out;
}

async function exportToExcel(){
  if(typeof JSZip === 'undefined'){
    showToast('No se pudo cargar el motor de Excel (sin conexión a internet). Intenta de nuevo con conexión.', true);
    return;
  }
  const zip = await loadExcelTemplate();
  if(!zip) return;
  const SHEETS = await resolveSheets(zip);
  const Q = k=> "'"+SHEETS[k].name.replace(/'/g,"''")+"'";

  // Cache de texto de cada hoja que vamos a modificar.
  const sheetXml = {};
  for(const key of Object.keys(XLSX_SHEET_FILES)){
    sheetXml[key] = await zip.file(SHEETS[key].file).async('string');
  }
  function set(sheetKey, coord, value, type){
    sheetXml[sheetKey] = xlSetCellValue(sheetXml[sheetKey], coord, value, type||'str');
  }
  // Celda con fórmula + valor ya calculado: se ve bien aun en Vista protegida y sin pulsar Enter.
  function setF(sheetKey, coord, formula, cached, kind){
    sheetXml[sheetKey] = xlSetCellValue(sheetXml[sheetKey], coord, { f:formula, v:cached }, kind==='num' ? 'fnum' : 'fstr');
  }

  // ---------------- PROBLEM STATEMENT ----------------
  // Limpiamos primero las 4 líneas de ejemplo de la plantilla y luego
  // escribimos los síntomas reales del caso (hasta 8 líneas).
  const symptoms = state.statement.symptoms.filter(x=>x.trim());
  for(let i=0;i<8;i++){
    set('PROBLEM STATEMENT', `I${5+i}`, symptoms[i] || '', 'str');
  }
  set('PROBLEM STATEMENT', 'I16', state.statement.statementText || '', 'str');

  // ---------------- CAUSE - EFFECT ----------------
  const catCols = { people:'B', machine:'F', environment:'J', material:'B', process:'F', measurement:'J' };
  const catStartRow = { people:9, machine:9, environment:9, material:27, process:27, measurement:27 };
  REF.ishikawaCategories.forEach(cat=>{
    const col = catCols[cat.key], startRow = catStartRow[cat.key];
    const causes = state.ishikawa[cat.key].filter(c=>c.text.trim());
    for(let i=0;i<14;i++){
      set('CAUSE - EFFECT', `${col}${startRow+i}`, causes[i] ? causes[i].text : '', 'str');
    }
  });
  const selectedCauses = getSelectedCauses().slice(0,10);
  for(let i=0;i<10;i++){
    set('CAUSE - EFFECT', `O${37+i}`, selectedCauses[i] ? selectedCauses[i].text : '', 'str');
  }
  setF('CAUSE - EFFECT', 'O17', `${Q('PROBLEM STATEMENT')}!I16`, state.statement.statementText || '', 'str');
  if(getSelectedCauses().length > 10){
    showToast('Solo se exportan las primeras 10 causas seleccionadas (límite de la plantilla).', true);
  }

  // ---------------- MULTI-VOTING MATRIX ----------------
  // Entradas (G-J, L) + fórmulas con su valor ya calculado (F, K, N).
  for(let i=0;i<10;i++){
    const rr = 5+i, row = state.matrixRows[i];
    const vals = row ? [row.influence, row.frequency, row.control, row.evidence] : [null,null,null,null];
    ['G','H','I','J'].forEach((col,k)=>{
      const v = vals[k];
      set('MULTI-VOTING MATRIX', `${col}${rr}`, v==null ? '' : v, v==null ? 'str' : 'num');
    });
    set('MULTI-VOTING MATRIX', `L${rr}`, !!(row && row.pass), 'bool');
    const txt = selectedCauses[i] ? selectedCauses[i].text : '';
    setF('MULTI-VOTING MATRIX', `F${rr}`, `IF(${Q('CAUSE - EFFECT')}!O${37+i}="","",${Q('CAUSE - EFFECT')}!O${37+i})`, txt, 'str');
    const anyScore = vals.some(v=>v!=null);
    const total = (vals[0]||0)*0.4 + (vals[1]||0)*0.3 + (vals[2]||0)*0.2 + (vals[3]||0)*0.1;
    setF('MULTI-VOTING MATRIX', `K${rr}`, `IF(COUNT(G${rr}:J${rr})=0,"",(G${rr}*0.4)+(H${rr}*0.3)+(I${rr}*0.2)+(J${rr}*0.1))`,
         anyScore ? Number(total.toFixed(10)) : '', anyScore ? 'num' : 'str');
    setF('MULTI-VOTING MATRIX', `N${rr}`, `IF(L${rr},F${rr},"")`, (row && row.pass) ? txt : '', 'str');
  }

  // ---------------- 5 WHYS ----------------
  // Cada bloque de 8 columnas (E-L, M-T, ...) corresponde a la FILA i de la matriz
  // (el encabezado del bloque lee 'MULTI-VOTING MATRIX'!N{5+i}). Por eso cada causa
  // se escribe en el bloque de SU fila de la matriz, no en el orden de aparición:
  // así los porqués y la causa quedan siempre en la misma columna.
  for(let b=0;b<10;b++){
    const hdrCol = xlColLetter(8+8*b), row = state.matrixRows[b];
    setF('5 WHYS', `${hdrCol}9`, `${Q('MULTI-VOTING MATRIX')}!N${5+b}`, (row && row.pass) ? row.causeText : '', 'str');
  }
  let skippedWhys = 0;
  state.whyGroups.forEach((g)=>{
    const b = state.matrixRows.findIndex(r=>r.causeId===g.causeId);
    if(b<0 || b>=10){ skippedWhys++; return; }
    const startCol = 5 + b*8; // E=5
    const pathCols = [startCol+3, startCol+4, startCol+5]; // H, I, J del bloque
    const levelRows = [13,16,19,22,25];
    ['A','B','C'].forEach((pk, pi)=>{
      const col = xlColLetter(pathCols[pi]);
      const path = g.paths[pk];
      levelRows.forEach((r, li)=>{
        const text = (path && path.levels[li]) ? path.levels[li].text : '';
        set('5 WHYS', `${col}${r}`, text, 'str');
      });
      if(path && path.closed && path.rootCause.trim()){
        set('5 WHYS', `${col}28`, path.rootCause, 'str');
      }
    });
  });
  if(skippedWhys) showToast('Algunas causas quedaron fuera de la plantilla (máximo 10 filas de matriz).', true);

  // ---------------- COUNTERMEASURES ----------------
  const mitigation = state.countermeasures.actions.filter(r=>r.type==='mitigation').slice(0,10);
  const elimination = state.countermeasures.actions.filter(r=>r.type==='elimination').slice(0,10);
  function writeCmRows(rows, startRow){
    for(let i=0;i<10;i++){
      const rr = startRow+i;
      const r = rows[i];
      set('COUNTERMEASURES', `C${rr}`, r ? r.rootCause : '', 'str');
      set('COUNTERMEASURES', `D${rr}`, r ? r.action : '', 'str');
      set('COUNTERMEASURES', `I${rr}`, r ? r.responsible : '', 'str');
      set('COUNTERMEASURES', `J${rr}`, r ? (/^(\d{4})-(\d{2})-(\d{2})$/.test(r.date||'') ? r.date.split('-').reverse().join('/') : (r.date||'')) : '', 'str');
    }
  }
  writeCmRows(mitigation, 5);
  writeCmRows(elimination, 20);
  if(state.countermeasures.actions.filter(r=>r.type==='mitigation').length>10 ||
     state.countermeasures.actions.filter(r=>r.type==='elimination').length>10){
    showToast('Solo se exportan las primeras 10 acciones por tipo (límite de la plantilla).', true);
  }

  // Volvemos a empaquetar el zip con las hojas modificadas; todo lo
  // demás (dibujos, imágenes, estilos, hojas ocultas) queda igual.
  for(const key of Object.keys(XLSX_SHEET_FILES)){
    zip.file(SHEETS[key].file, sheetXml[key]);
  }
  // Fuerza el recálculo completo al abrir y descarta la cadena de cálculo vieja
  // (si no, Excel muestra valores antiguos hasta que se pulsa Enter en cada celda).
  let wbXml = await zip.file('xl/workbook.xml').async('string');
  wbXml = /<calcPr[^>]*\/>/.test(wbXml) ? wbXml.replace(/<calcPr[^>]*\/>/, '<calcPr calcId="191029" fullCalcOnLoad="1"/>')
                                         : wbXml.replace('</workbook>', '<calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>');
  zip.file('xl/workbook.xml', wbXml);
  if(zip.file('xl/calcChain.xml')){
    zip.remove('xl/calcChain.xml');
    const ct = await zip.file('[Content_Types].xml').async('string');
    zip.file('[Content_Types].xml', ct.replace(/<Override [^>]*calcChain[^>]*\/>/, ''));
    const rl = await zip.file('xl/_rels/workbook.xml.rels').async('string');
    zip.file('xl/_rels/workbook.xml.rels', rl.replace(/<Relationship [^>]*calcChain[^>]*\/>/, ''));
  }
  const blob = await zip.generateAsync({ type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  downloadBlob(blob, (state.projectName||'problem_solving').replace(/[^a-z0-9]+/gi,'_')+'.xlsx');
}

// Convierte un estado guardado por una versión anterior de la app al
// formato actual, para que abrir un proyecto viejo nunca rompa la carga.
function migrateState(s){
  if(!s.countermeasures || typeof s.countermeasures !== 'object'){
    s.countermeasures = { actions: [] };
  }
  if(!Array.isArray(s.countermeasures.actions)){
    // Formato antiguo: dos tablas separadas (mitigación/eliminación) -> unificarlas en una.
    const old = s.countermeasures;
    const merged = [];
    if(Array.isArray(old.mitigation)) merged.push(...old.mitigation.map(r=>({...r, type: r.type||'mitigation'})));
    if(Array.isArray(old.elimination)) merged.push(...old.elimination.map(r=>({...r, type: r.type||'elimination'})));
    s.countermeasures = { actions: merged };
  }
  s.countermeasures.actions.forEach(r=>{ if(!r.type) r.type='mitigation'; });
  if(!s.microProgress || typeof s.microProgress !== 'object') s.microProgress = {};
  if(typeof s.unlockedCount !== 'number' || s.unlockedCount<1) s.unlockedCount = 1;
  if(s.theme!=='light' && s.theme!=='blue' && s.theme!=='dark') s.theme = 'light';
  if(s.backgroundImage===undefined) s.backgroundImage = null;
  if(!s.welcomeCardImages || typeof s.welcomeCardImages !== 'object') s.welcomeCardImages = { tl:null, tr:null, bl:null, br:null };
  ['tl','tr','bl','br'].forEach(k=>{ if(s.welcomeCardImages[k]===undefined) s.welcomeCardImages[k]=null; });
  if(typeof s.videoUrl !== 'string') s.videoUrl = '';
  if(!s.shibumi || typeof s.shibumi !== 'object') s.shibumi = {};
  s.shibumi = Object.assign(shDefaults(), s.shibumi);
  if(!Array.isArray(s.shibumi.lines) || !s.shibumi.lines.length) s.shibumi.lines = shDefaults().lines;
  s.shibumi.lines = s.shibumi.lines.map(shConvLine);
  return s;
}

/* ============================================================
   DICTADO POR VOZ (Web Speech API) · botón flotante
   - "Dictar en el campo": escribe en el campo seleccionado y sigue al cambiar de campo (sin reactivar el micrófono).
   - "Dictar esta sección": recorre campo por campo SOLO la sección actual.
   - Comandos (frase completa): siguiente · anterior · borrar · detener.
   ============================================================ */
var Dict = (()=>{
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec=null, active=false, mode='free', target=null, gi=0, open=false, want=false, interim='', touched=new Set();
  const fab=document.createElement('button'); fab.id='dict-fab'; fab.type='button'; fab.setAttribute('aria-label','Dictado por voz');
  fab.innerHTML='<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
  const panel=document.createElement('div'); panel.id='dict-panel';
  document.body.appendChild(fab); document.body.appendChild(panel);
  const langCode=()=> LANG==='en' ? 'en-US' : 'es-CL';
  const langName=()=> LANG==='en' ? 'English' : 'Español';
  const isField=el=>!!el && el.nodeType===1 && !el.closest('#dict-panel') && !el.disabled && !el.readOnly && el.id!=='gsearch' &&
    (el.tagName==='TEXTAREA' || (el.tagName==='INPUT' && /^(text|)$/i.test(el.getAttribute('type')||'text')));
  const visible=el=>!!(el.offsetParent || el.getClientRects().length);
  const fieldsOf=key=>{ const sec=document.getElementById('section-'+key); if(!sec) return []; return [...sec.querySelectorAll('input,textarea')].filter(e=>isField(e)&&visible(e)); };
  const keyOf=el=> el.dataset&&el.dataset.bind ? '[data-bind="'+el.dataset.bind+'"]' : (el.id?'#'+el.id:'');
  const refind=()=>{ if(target&&target.isConnected) return target; const k=target&&target._k; if(k){ const e=document.querySelector(k); if(e) { e._k=k; target=e; return e; } } return null; };
  function labelOf(el){
    let t=''; const fr=el.closest('.field-row'); const lab=fr&&fr.querySelector('.field-label'); if(lab){ const c=lab.cloneNode(true); c.querySelectorAll('button,small,sup,[class*="tip"],[class*="info"],[data-tip]').forEach(x=>x.remove()); t=c.textContent.replace(/\s+i$/,''); }
    const td=el.closest('td');
    if(!t && td){ const tr=td.parentElement, i=[...tr.children].indexOf(td), tb=tr.closest('table'), th=tb&&tb.querySelectorAll('thead th')[i]; const n=tb?[...tb.querySelectorAll('tbody tr')].indexOf(tr)+1:0; if(th) t=th.textContent+(n?' · '+L('fila','row')+' '+n:''); }
    if(!t) t=el.getAttribute('placeholder')||el.getAttribute('aria-label')||el.title||L('Campo','Field');
    return t.replace(/\s+/g,' ').trim().slice(0,90);
  }
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
  const CMD={ next:/^(siguiente|siguiente campo|sigue|proximo|proximo campo|pasar al siguiente|pasa al siguiente|avanzar|adelante|next|next field|go next|go to next|continue)$/,
              prev:/^(anterior|campo anterior|atras|retroceder|volver|previous|previous field|back|go back)$/,
              clear:/^(borrar|borrar campo|limpiar|limpiar campo|clear|clear field|delete field|erase)$/,
              stop:/^(detener|detener dictado|parar|terminar|fin del dictado|stop|stop dictation|done|finish)$/ };
  /* comando al final de la frase: "… descripción del problema siguiente" */
  const TAIL=[['next',/[\s,.;:!?]*\b(?:siguiente(?: campo)?|next(?: field)?)[\s.,;:!?]*$/i],['stop',/[\s,.;:!?]*\b(?:detener(?: dictado)?|stop(?: dictation)?)[\s.,;:!?]*$/i],
              ['prev',/[\s,.;:!?]*\b(?:campo anterior|previous field)[\s.,;:!?]*$/i],['clear',/[\s,.;:!?]*\b(?:borrar campo|clear field)[\s.,;:!?]*$/i]];
  function fmt(text, multi){
    let t=' '+text.trim()+' ';
    const nl = multi ? '\n' : ' ';
    const R= LANG==='en'
      ? [[/\s+question mark\b/gi,'?'],[/\s+full stop\b/gi,'.'],[/\s+semicolon\b/gi,';'],[/\s+colon\b/gi,':'],[/\s+comma\b/gi,','],[/\s+new line\b/gi,nl]]
      : [[/\s+signo de interrogaci[oó]n\b/gi,'?'],[/\s+punto y coma\b/gi,';'],[/\s+punto final\b/gi,'.'],[/\s+dos puntos\b/gi,':'],[/\s+coma\b/gi,','],[/\s+(nueva l[ií]nea|salto de l[ií]nea)\b/gi,nl]];
    R.forEach(([a,b])=>{ t=t.replace(a,b); });
    return t.replace(/\s+([.,;:?])/g,'$1').trim();
  }
  const cap=s=>s.replace(/^\s*(\S)/,(m,c)=>m.replace(c,c.toUpperCase()));
  function setTarget(el,scroll){
    if(!el) return; el._k=keyOf(el);
    document.querySelectorAll('.dict-target').forEach(x=>x.classList.remove('dict-target'));
    target=el; el.classList.add('dict-target');
    if(scroll){
      if(matchMedia('(pointer:coarse)').matches){ el.setAttribute('inputmode','none'); touched.add(el); }
      try{ el.focus({preventScroll:true}); }catch(_){}
      el.scrollIntoView({block:'center',behavior:'smooth'});
    }
  }
  const secFields=()=>fieldsOf(currentSection);
  function move(d){
    const L2=secFields(); if(!L2.length) return;
    let i=target?L2.indexOf(refind()||target):-1;
    if(i<0) i=Math.max(0,Math.min(gi,L2.length-1)); else i+=d;
    if(i>=L2.length){ if(mode==='guided'){ stop(); showToast(L('Sección completa ✔','Section complete ✔')); return; } i=L2.length-1; }
    if(i<0) i=0;
    gi=i; setTarget(L2[i],true); render();
  }
  function commit(text){
    const el=refind(); if(!isField(el)){ showToast(L('Selecciona un campo para dictar','Select a field to dictate'),true); return; }
    const t=fmt(text, el.tagName==='TEXTAREA'); if(!t) return;
    const cur=el.value||'';
    let v = cur ? cur.replace(/[ \t]+$/,'')+(/^[.,;:?]/.test(t)||/\n$/.test(cur)?'':' ')+t : t;
    v = cur ? v : cap(v);
    v = v.replace(/([.?!]\s+)([a-záéíóúñ])/g,(m,a,b)=>a+b.toUpperCase());
    el.value=v; el.dispatchEvent(new Event('input',{bubbles:true}));
    if(el.id==='qa-text'){ ACTIONS['qa-add'](); const again=document.getElementById('qa-text'); if(again){ setTarget(again,false); } }
    el.classList.add('dict-target');
  }
  function runCmd(c){
    if(c==='stop') stop(); else if(c==='next') move(1); else if(c==='prev') move(-1);
    else if(c==='clear'){ const el=refind(); if(isField(el)){ el.value=''; el.dispatchEvent(new Event('input',{bubbles:true})); } }
  }
  function handleFinal(raw){
    const n=norm(raw); if(!n) return;
    for(const c of ['stop','next','prev','clear']) if(CMD[c].test(n)){ runCmd(c); return; }
    for(const [c,re] of TAIL){ if(re.test(raw)){ const rest=raw.replace(re,'').trim(); if(rest) commit(rest); runCmd(c); return; } }
    commit(raw);
  }
  function build(){
    rec=new SR(); rec.lang=langCode(); rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
    rec.onresult=e=>{ let itm=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) handleFinal(r[0].transcript); else itm+=r[0].transcript; } interim=itm; render(); };
    rec.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ want=false; stop(); showToast(L('El navegador bloqueó el micrófono: permítelo en el candado de la barra de direcciones','The browser blocked the microphone: allow it in the address bar lock icon'),true); } };
    rec.onend=()=>{ interim=''; if(active&&want){ setTimeout(()=>{ if(!(active&&want)) return; try{ rec.lang=langCode(); rec.start(); }catch(_){} },250); } render(); };
  }
  function begin(m){
    if(!SR){ showToast(L('Tu navegador no admite dictado por voz: usa Chrome o Edge','Your browser does not support voice dictation: use Chrome or Edge'),true); return; }
    mode=m; active=true; want=true; open=true;
    if(!rec) build();
    try{ rec.lang=langCode(); rec.start(); }catch(_){}
    if(m==='guided'){ const l=secFields(); gi=0; if(l[0]) setTarget(l[0],true); else { showToast(L('No hay campos para dictar en esta sección','No fields to dictate in this section'),true); stop(); return; } }
    else { const a=document.activeElement; if(isField(a)) setTarget(a,false); else { const l=secFields(); if(l[0]) setTarget(l[0],true); } }
    render();
  }
  function stop(){
    active=false; want=false; interim='';
    try{ rec&&rec.stop(); }catch(_){}
    document.querySelectorAll('.dict-target').forEach(x=>x.classList.remove('dict-target'));
    touched.forEach(e=>{ try{ e.removeAttribute('inputmode'); }catch(_){} }); touched.clear();
    render();
  }
  function render(){
    fab.classList.toggle('on',active); fab.title=L('Dictado por voz','Voice dictation');
    panel.classList.toggle('open',open);
    if(!open){ panel.innerHTML=''; return; }
    const el=refind(); const secL=secFields(); const pos=(mode==='guided'&&el)? (secL.indexOf(el)+1)+'/'+secL.length : '';
    if(!active){
      panel.innerHTML=`<div class="dp-h"><b>🎤 ${L('Dictado por voz','Voice dictation')}</b><button type="button" class="dp-x" data-dp="close" aria-label="${L('Cerrar','Close')}">✕</button></div>
        <button type="button" class="dp-btn" data-dp="free"><b>${L('Dictar en el campo seleccionado','Dictate in the selected field')}</b><small>${L('Haz clic en un campo y habla. Cambia de campo cuando quieras sin reactivar el micrófono.','Click a field and speak. Switch fields any time without restarting the microphone.')}</small></button>
        <button type="button" class="dp-btn" data-dp="guided"><b>${L('Dictar esta sección, campo por campo','Dictate this section, field by field')}</b><small>${L('Te lleva por cada campo de la sección actual, solo de esta sección.','Walks you through each field of the current section only.')}</small></button>
        <p class="dp-note">${L('Idioma','Language')}: <b>${langName()}</b> · ${L('Di «siguiente», «anterior», «borrar» o «detener». Puntuación: «coma», «dos puntos», «punto final», «nueva línea».','Say “next”, “previous”, “clear” or “stop”. Punctuation: “comma”, “colon”, “full stop”, “new line”.')}</p>`;
    } else {
      panel.innerHTML=`<div class="dp-h"><b><span class="dp-dot"></span> ${L('Escuchando…','Listening…')} ${pos?'<span class="dp-pos">'+pos+'</span>':''}</b><button type="button" class="dp-x" data-dp="close" aria-label="${L('Minimizar','Minimize')}">—</button></div>
        <div class="dp-field">${el?esc(labelOf(el)):L('Haz clic en un campo','Click a field')}</div>
        <div class="dp-live">${interim?esc(interim):'<span class="dp-hint">'+L('Habla ahora…','Speak now…')+'</span>'}</div>
        <div class="dp-row"><button type="button" class="dp-s" data-dp="prev">‹ ${L('Anterior','Previous')}</button><button type="button" class="dp-s" data-dp="next">${L('Siguiente','Next')} ›</button><button type="button" class="dp-s" data-dp="clear">${L('Borrar','Clear')}</button><button type="button" class="dp-s stop" data-dp="stop">■ ${L('Detener','Stop')}</button></div>`;
    }
  }
  panel.addEventListener('click',e=>{ const b=e.target.closest('[data-dp]'); if(!b) return; const a=b.dataset.dp;
    if(a==='close'){ open=false; render(); } else if(a==='free') begin('free'); else if(a==='guided') begin('guided');
    else if(a==='stop') stop(); else if(a==='next') move(1); else if(a==='prev') move(-1);
    else if(a==='clear') runCmd('clear'); });
  panel.addEventListener('mousedown',e=>e.preventDefault());
  fab.addEventListener('mousedown',e=>e.preventDefault());
  fab.addEventListener('click',()=>{ open=!open; render(); });
  document.addEventListener('focusin',e=>{ if(active && isField(e.target)){ setTarget(e.target,false); if(mode==='guided'){ const i=secFields().indexOf(e.target); if(i>=0) gi=i; } render(); } });
  const welcome=()=>{ const w=!!document.getElementById('welcome-screen'); fab.style.display=w?'none':''; if(w) panel.style.display='none'; else panel.style.display=''; };
  new MutationObserver(welcome).observe(document.body,{childList:true,subtree:true}); welcome();
  render();
  return { onLang(){ if(active&&rec){ try{ rec.stop(); }catch(_){} } render(); }, render };
})();
</script>
</body>
</html>
