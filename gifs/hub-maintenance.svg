    <path d="M60 0 L0 0 0 60" fill="none" stroke="#1c3a5c" stroke-width="1" opacity="0.06"/>
  </pattern>
</defs>
<rect width="1600" height="900" fill="#030c1a"/>
<rect width="1600" height="900" fill="url(#grid)"/>

