<svg viewBox="0 0 1900 900" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="metalRing" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#8a5a1a"/>
    <stop offset="40%" stop-color="#ffffff"/>
    <stop offset="55%" stop-color="#ff8c1a"/>
    <stop offset="100%" stop-color="#8a5a1a"/>
  </linearGradient>
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M60 0 L0 0 0 60" fill="none" stroke="#1c3a5c" stroke-width="1" opacity="0.06"/>
  </pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <linearGradient id="reflGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1900" height="900" fill="#030c1a"/>
<rect width="1900" height="900" fill="url(#grid)"/>

