<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e87722" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#e87722" stop-opacity="0"/>
      <stop offset="1" stop-color="#e87722" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e87722" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#e87722" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridMask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1600" height="200" fill="url(#gridMask)"/></mask>
  </defs>

  <!-- fondo: glow naranja a la derecha + grilla técnica -->
  <rect width="1600" height="200" fill="url(#fade)"/>
  <rect width="1600" height="200" fill="url(#grid)" mask="url(#m)"/>

  <!-- líneas de flujo: cada sistema alimenta el índice global -->
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M868 100 H1382" stroke="url(#flow)"/>
    <path d="M868 100 C 960 30, 1250 30, 1382 88" stroke="#e87722" stroke-opacity="0.25" stroke-dasharray="4 8"/>
    <path d="M868 100 C 960 170, 1250 170, 1382 112" stroke="#e87722" stroke-opacity="0.25" stroke-dasharray="4 8"/>
  </g>

  <!-- ===== 6S ===== -->
  <g transform="translate(830 100)">
    <circle r="40" fill="#0a1a32" stroke="#e87722" stroke-width="2"/>
    <g fill="none" stroke="#e87722" stroke-width="3">
      <rect x="-17" y="-17" width="14" height="14" rx="3"/>
      <rect x="3" y="-17" width="14" height="14" rx="3"/>
      <rect x="-17" y="3" width="14" height="14" rx="3"/>
      <rect x="3" y="3" width="14" height="14" rx="3"/>
    </g>
    <text y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#ffffff" fill-opacity="0.85">6S</text>
  </g>

  <!-- ===== STANDARD WORK ===== -->
  <g transform="translate(1010 100)">
    <circle r="40" fill="#0a1a32" stroke="#e87722" stroke-width="2"/>
    <g fill="none" stroke="#e87722" stroke-width="3.5" stroke-linecap="round">
      <path d="M-14 16 V2"/><path d="M0 16 V-16"/><path d="M14 16 V-6"/><path d="M-20 18 H20"/>
    </g>
    <text y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#ffffff" fill-opacity="0.85">STANDARD WORK</text>
  </g>

  <!-- ===== MATURITY ASSESSMENT ===== -->
  <g transform="translate(1190 100)">
    <circle r="40" fill="#0a1a32" stroke="#e87722" stroke-width="2"/>
    <g fill="none" stroke="#e87722" stroke-width="3" stroke-linejoin="round">
      <circle cy="-5" r="11"/>
      <path d="M-7 4 L-11 20 L0 14 L11 20 L7 4"/>
    </g>
    <text y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#ffffff" fill-opacity="0.85">MATURITY</text>
  </g>

  <!-- ===== ÍNDICE GLOBAL (gauge) ===== -->
  <g transform="translate(1440 100)">
    <circle r="62" fill="#0a1a32" stroke="#ffffff" stroke-opacity="0.12" stroke-width="10"/>
    <!-- arco ~70% -->
    <circle r="62" fill="none" stroke="#e87722" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="273 390" transform="rotate(-90)"/>
    <circle r="48" fill="none" stroke="#e87722" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 6"/>
    <text y="-4" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#ffffff">BEST</text>
    <text y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#e87722">GLOBAL INDEX</text>
  </g>

  <!-- puntos de conexión -->
  <g fill="#e87722">
    <circle cx="920" cy="100" r="3"/><circle cx="1100" cy="100" r="3"/><circle cx="1280" cy="100" r="3"/>
  </g>
</svg>
